<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/magiboka-logo.webp" />
    <title>Magiboka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Toggle dark mode by adding/removing the `dark` class on <html>.
      // App.tsx reads prefers-color-scheme and localStorage("magiboka_theme")
      // on mount and keeps the class in sync with the chosen theme.
      tailwind.config = { darkMode: 'class' };
      // Pre-apply the saved theme before React renders so the page doesn't
      // flash the wrong background on cold load.
      (function () {
        try {
          var stored = localStorage.getItem('magiboka_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored === null && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) { /* localStorage blocked in private mode — ignore */ }
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Quicksand', sans-serif;
        background-color: #f3f4f6;
      }
      html.dark body {
        background-color: #15161a;
        color: #e5e7eb;
      }
      html.dark .book-shadow {
        box-shadow:
          0 4px 8px rgba(0,0,0,0.4),
          0 8px 16px rgba(0,0,0,0.4),
          inset 20px 0 50px rgba(0,0,0,0.2);
      }
      html.dark .page-curl {
        background: linear-gradient(to right, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 5%, rgba(0,0,0,0) 95%, rgba(255,255,255,0.03) 100%);
      }
      /* The Magiboka logo file has a white backdrop baked in. In dark
         mode we blend the white into the page so only the coloured
         marks of the logo are visible — no floating white badge. */
      html.dark .logo-blend {
        mix-blend-mode: screen;
      }
      .font-serif {
        font-family: 'Lora', serif;
      }
      .book-shadow {
        box-shadow: 
          0 4px 8px rgba(0,0,0,0.1),
          0 8px 16px rgba(0,0,0,0.1),
          inset 20px 0 50px rgba(0,0,0,0.05);
      }
      .page-curl {
        background: linear-gradient(to right, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 5%, rgba(0,0,0,0) 95%, rgba(0,0,0,0.05) 100%);
      }
      
      /* 3D Page Turn Animation Styles */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(-180deg);
      }
      .origin-left {
        transform-origin: left center;
      }
      
      @keyframes pageFlip {
        0% { transform: rotateY(0deg); }
        15% { transform: rotateY(-5deg); } /* Slow start */
        100% { transform: rotateY(-180deg); }
      }
      
      .animate-page-flip {
        animation: pageFlip 3s infinite cubic-bezier(0.645, 0.045, 0.355, 1); /* Smooth Ease-in-out */
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
      
      .animate-float {
        animation: float 6s ease-in-out infinite; /* Slower, calmer float */
      }
      
      @keyframes progress-stripe {
        0% { background-position: 1rem 0; }
        100% { background-position: 0 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
