<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/magiboka-ikon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <title>Magiboka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Toggle dark mode by adding/removing the `dark` class on <html>.
      // Dark is the default; localStorage("magiboka_theme") holds the choice
      // of someone who has switched. App.tsx reads the class on mount and
      // keeps it in sync with the chosen theme.
      tailwind.config = { darkMode: 'class' };
      // Pre-apply the theme before React renders so the page doesn't
      // flash the wrong background on cold load.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('magiboka_theme');
        } catch (e) { /* localStorage blocked in private mode — ignore */ }
        if (stored !== 'light') document.documentElement.classList.add('dark');
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Quicksand', sans-serif;
        background-color: #f3f4f6;
      }
      html.dark body {
        background-color: #15161a;
        color: #e5e7eb;
      }
      html.dark .book-shadow {
        box-shadow:
          0 4px 8px rgba(0,0,0,0.4),
          0 8px 16px rgba(0,0,0,0.4),
          inset 20px 0 50px rgba(0,0,0,0.2);
      }
      html.dark .page-curl {
        background: linear-gradient(to right, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 5%, rgba(0,0,0,0) 95%, rgba(255,255,255,0.03) 100%);
      }
      .font-serif {
        font-family: 'Lora', serif;
      }
      .book-shadow {
        box-shadow: 
          0 4px 8px rgba(0,0,0,0.1),
          0 8px 16px rgba(0,0,0,0.1),
          inset 20px 0 50px rgba(0,0,0,0.05);
      }
      .page-curl {
        background: linear-gradient(to right, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 5%, rgba(0,0,0,0) 95%, rgba(0,0,0,0.05) 100%);
      }
      
      /* Turning to the next page (components/BookPage.tsx).

         Wide screens: the book lies open, and the old right-hand page is
         lifted calmly around the spine and lands as the new left-hand page,
         with a soft glow along its edge and a little stardust.
         Phones: the page slides away to the left and the next one comes in
         from the right (done with element.animate in BookPage.tsx). */
      .turn-layer {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
      }
      .turn {
        position: absolute;
        inset: 0;
        --turn: 1.7s;
        --turn-ease: cubic-bezier(0.42, 0, 0.3, 1);
        transition: opacity 0.25s ease-out;
      }
      .turn-done { opacity: 0; }
      .turn-stage {
        position: absolute;
        inset: 0;
        perspective: 3000px;
      }
      .turn-under,
      .turn-shadow,
      .turn-sheet {
        position: absolute;
      }
      .turn-under,
      .turn-face {
        display: flex;
        overflow: hidden;
        background: #fdfbf7;
      }
      html.dark .turn-under,
      html.dark .turn-face {
        background: #1f2937;
      }
      /* The shadow the lifted page casts on the new page beneath it. */
      .turn-shadow {
        border-radius: 0 1.25rem 1.25rem 0;
        background: linear-gradient(to right, rgba(0,0,0,0.28), rgba(0,0,0,0.06) 70%, rgba(0,0,0,0));
        animation: turnShadow var(--turn) var(--turn-ease) forwards;
      }
      @keyframes turnShadow {
        0%   { opacity: 1; }
        55%, 100% { opacity: 0; }
      }
      .turn-sheet {
        transform-origin: left center;
        transform-style: preserve-3d;
        will-change: transform;
        animation: turnSheet var(--turn) var(--turn-ease) forwards;
      }
      @keyframes turnSheet {
        from { transform: rotateY(0deg); }
        to   { transform: rotateY(-180deg); }
      }
      .turn-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .turn-front { border-radius: 0 1.25rem 1.25rem 0; }
      .turn-back { transform: rotateY(180deg); }
      /* The page darkens a little as it stands up, and lightens as it lands. */
      .turn-face::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(to right, rgba(0,0,0,0.04), rgba(0,0,0,0.2));
      }
      .turn-front::after { animation: turnShadeFront var(--turn) var(--turn-ease) forwards; }
      .turn-back::after  { animation: turnShadeBack var(--turn) var(--turn-ease) forwards; }
      @keyframes turnShadeFront {
        0%   { opacity: 0; }
        50%, 100% { opacity: 1; }
      }
      @keyframes turnShadeBack {
        0%, 50% { opacity: 1; }
        100% { opacity: 0; }
      }
      /* A soft golden glow along the free edge while the page is in the air. */
      .turn-edge {
        position: absolute;
        top: 2%;
        bottom: 2%;
        right: -1px;
        width: 3px;
        border-radius: 3px;
        background: #fde68a;
        box-shadow: 0 0 8px 2px rgba(251,191,36,0.75), 0 0 26px 8px rgba(251,191,36,0.3);
        opacity: 0;
        animation: turnEdge var(--turn) var(--turn-ease) forwards;
      }
      @keyframes turnEdge {
        0%, 100% { opacity: 0; }
        20%, 80% { opacity: 1; }
      }
      /* A little stardust drifting down from the edge. */
      .turn-star {
        position: absolute;
        margin: -6px 0 0 -6px;
        opacity: 0;
        background: #fbbf24;
        clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
        animation: turnStar 1.2s ease-out both;
      }
      .turn-star:nth-child(3n)   { background: #fef3c7; }
      .turn-star:nth-child(4n+1) { background: #c4b5fd; }
      @keyframes turnStar {
        0%   { opacity: 0; transform: translate(0, 0) scale(0) rotate(0deg); }
        20%  { opacity: 0.95; transform: translate(0, 0) scale(1) rotate(30deg); }
        100% { opacity: 0; transform: translate(var(--drift), var(--fall)) scale(0.3) rotate(140deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
