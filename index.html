<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/magiboka-ikon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <title>Magiboka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Toggle dark mode by adding/removing the `dark` class on <html>.
      // Dark is the default; localStorage("magiboka_theme") holds the choice
      // of someone who has switched. App.tsx reads the class on mount and
      // keeps it in sync with the chosen theme.
      tailwind.config = { darkMode: 'class' };
      // Pre-apply the theme before React renders so the page doesn't
      // flash the wrong background on cold load.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('magiboka_theme');
        } catch (e) { /* localStorage blocked in private mode — ignore */ }
        if (stored !== 'light') document.documentElement.classList.add('dark');
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Quicksand', sans-serif;
        background-color: #f3f4f6;
      }
      html.dark body {
        background-color: #15161a;
        color: #e5e7eb;
      }
      html.dark .book-shadow {
        box-shadow:
          0 4px 8px rgba(0,0,0,0.4),
          0 8px 16px rgba(0,0,0,0.4),
          inset 20px 0 50px rgba(0,0,0,0.2);
      }
      html.dark .page-curl {
        background: linear-gradient(to right, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 5%, rgba(0,0,0,0) 95%, rgba(255,255,255,0.03) 100%);
      }
      .font-serif {
        font-family: 'Lora', serif;
      }
      .book-shadow {
        box-shadow: 
          0 4px 8px rgba(0,0,0,0.1),
          0 8px 16px rgba(0,0,0,0.1),
          inset 20px 0 50px rgba(0,0,0,0.05);
      }
      .page-curl {
        background: linear-gradient(to right, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 5%, rgba(0,0,0,0) 95%, rgba(0,0,0,0.05) 100%);
      }
      
      /* 3D Page Turn Animation Styles */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(-180deg);
      }
      .origin-left {
        transform-origin: left center;
      }
      
      @keyframes pageFlip {
        0% { transform: rotateY(0deg); }
        15% { transform: rotateY(-5deg); } /* Slow start */
        100% { transform: rotateY(-180deg); }
      }
      
      .animate-page-flip {
        animation: pageFlip 3s infinite cubic-bezier(0.645, 0.045, 0.355, 1); /* Smooth Ease-in-out */
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
      
      .animate-float {
        animation: float 6s ease-in-out infinite; /* Slower, calmer float */
      }
      
      /* Turning to the next page (components/BookPage.tsx): a sheet of paper
         lies over the new page and is lifted calmly over to the left, around
         the spine. On a phone it covers the whole book and turns out of view;
         on a wide screen it is the right-hand page landing on the left. */
      .page-turn-sheet {
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        transform-origin: left center;
        backface-visibility: visible;
        background:
          linear-gradient(to right, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0) 12%, rgba(0,0,0,0) 88%, rgba(0,0,0,0.06) 100%),
          #fdfbf7;
        box-shadow: 8px 0 24px rgba(0,0,0,0.12);
        --turn-end: -100deg;
        animation: pageTurn 1.1s cubic-bezier(0.45, 0.05, 0.25, 1) forwards;
        will-change: transform, opacity;
      }
      html.dark .page-turn-sheet {
        background:
          linear-gradient(to right, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 12%, rgba(0,0,0,0) 88%, rgba(0,0,0,0.2) 100%),
          #1f2937;
        box-shadow: 8px 0 24px rgba(0,0,0,0.4);
      }
      /* On a wide screen the book lies open and the turn is a real one,
         built in components/BookPage.tsx: the old right-hand page is lifted
         around the spine and lands as the new left-hand page. */
      @media (min-width: 1024px) {
        .page-turn-sheet { display: none; }
      }
      .book-turn-layer {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 40;
        pointer-events: none;
      }
      @media (min-width: 1024px) {
        .book-turn-layer { display: block; }
      }
      .book-turn-stage {
        position: absolute;
        inset: 0;
        perspective: 3200px;
      }
      .book-turn-under,
      .book-turn-blank,
      .book-turn-sheet {
        position: absolute;
      }
      /* Blank paper over the new text until the turning page has passed. */
      .book-turn-blank {
        background: #fdfbf7;
        border-radius: 0 1.25rem 1.25rem 0;
        animation: bookTurnBlank 1.8s ease-out forwards;
      }
      html.dark .book-turn-blank {
        background: #1f2937;
      }
      @keyframes bookTurnBlank {
        0%   { opacity: 1; }
        50%  { opacity: 1; }
        100% { opacity: 0; }
      }
      .book-turn-under,
      .book-turn-face {
        display: flex;
        overflow: hidden;
        background: #fdfbf7;
      }
      html.dark .book-turn-under,
      html.dark .book-turn-face {
        background: #1f2937;
      }
      .book-turn-sheet {
        transform-origin: left center;
        transform-style: preserve-3d;
        animation: bookTurn 1.8s cubic-bezier(0.45, 0.05, 0.25, 1) forwards;
        will-change: transform;
      }
      .book-turn-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .book-turn-front { border-radius: 0 1.25rem 1.25rem 0; }
      .book-turn-back { transform: rotateY(180deg); }
      /* The page darkens a little as it stands up, and lightens as it lands. */
      .book-turn-face::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
      }
      .book-turn-front::after {
        background: linear-gradient(to right, rgba(0,0,0,0.05), rgba(0,0,0,0.22));
        animation: bookTurnShadeFront 1.8s cubic-bezier(0.45, 0.05, 0.25, 1) forwards;
      }
      .book-turn-back::after {
        background: linear-gradient(to right, rgba(0,0,0,0.05), rgba(0,0,0,0.22));
        animation: bookTurnShadeBack 1.8s cubic-bezier(0.45, 0.05, 0.25, 1) forwards;
      }
      @keyframes bookTurn {
        0%   { transform: rotateY(0deg); }
        100% { transform: rotateY(-180deg); }
      }
      @keyframes bookTurnShadeFront {
        0%   { opacity: 0; }
        50%  { opacity: 1; }
        100% { opacity: 1; }
      }
      @keyframes bookTurnShadeBack {
        0%   { opacity: 1; }
        50%  { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes pageTurn {
        0%   { transform: perspective(2400px) rotateY(0deg); opacity: 1; }
        12%  { transform: perspective(2400px) rotateY(-4deg); opacity: 1; }
        70%  { opacity: 1; }
        100% { transform: perspective(2400px) rotateY(var(--turn-end)); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .page-turn-sheet { display: none; }
      }

      @keyframes progress-stripe {
        0% { background-position: 1rem 0; }
        100% { background-position: 0 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
